services:
  db:
    image: postgres:16-alpine
    container_name: me-supplies-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: me_supplies
    volumes:
      - pg_data:/var/lib/postgresql/data
      - type: bind
        source: ./migrations
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: me-supplies-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/me_supplies?sslmode=disable&search_path=me_supplies
      JWT_SECRET: ${JWT_SECRET:-tdt-me-platform-jwt-secret-key-change-in-prod}
      PORT: 8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_STANDALONE: "true"
        NEXT_PUBLIC_API_URL: "/api"
        BACKEND_INTERNAL_URL: "http://backend:8080"
    container_name: me-supplies-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      BACKEND_INTERNAL_URL: http://backend:8080
    restart: unless-stopped

volumes:
  pg_data:
