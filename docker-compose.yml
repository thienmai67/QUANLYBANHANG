services:
  db:
    image: postgres:16-alpine
    container_name: me-supplies-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: me_supplies
    volumes:
      - pg_data:/var/lib/postgresql/data
      - type: bind
        source: ./migrations
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: me-supplies-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/me_supplies?sslmode=disable&search_path=me_supplies
      JWT_SECRET: ${JWT_SECRET:-tdt-me-platform-jwt-secret-key-change-in-prod}
      PORT: 8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6KWJm5ueZ3OvGYFDsdL_h0YYdB-tZ4FiV7vL_0bxFNjzA}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-d7f9b399-3d56-45c7-b937-0970ddc97f21}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-e8226858-d2c4-4fde-a760-f1141cd78768}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-3a99117abf7ed84649f13c1880461b629b559c6b790b8111cc6dfdda5f0c07d0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1017933497759-0b981fb3g3qftvco5t7jblsm60s2ktu7.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://tdtmaterial.id.vn/api/v1/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://tdtmaterial.id.vn}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_STANDALONE: "true"
        NEXT_PUBLIC_API_URL: "/api"
        BACKEND_INTERNAL_URL: "http://backend:8080"
    container_name: me-supplies-frontend
    depends_on:
      - backend
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      BACKEND_INTERNAL_URL: http://backend:8080
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: me-supplies-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  pg_data:
  caddy_data:
  caddy_config:
